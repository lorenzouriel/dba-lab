services:
  # ============================================================
  # Octopus Deploy internal database (Express — lightweight)
  # ============================================================
  octopus-db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: octopus-db
    hostname: octopus-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1400:1433"
    networks:
      - dba-lab_dba-lab
    volumes:
      - octopus-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -No -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # Octopus Deploy Server
  # ============================================================
  octopus-server:
    image: octopusdeploy/octopusdeploy:latest
    container_name: octopus-server
    privileged: true
    environment:
      ACCEPT_EULA: "${ACCEPT_OCTOPUS_EULA}"
      DB_CONNECTION_STRING: "Server=octopus-db,1433;Database=OctopusDeploy;User=sa;Password=${SA_PASSWORD}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      OCTOPUS_SERVER_BASE64_LICENSE: "${OCTOPUS_SERVER_BASE64_LICENSE}"
    ports:
      - "8080:8080"
    depends_on:
      octopus-db:
        condition: service_healthy
    networks:
      - dba-lab_dba-lab
    volumes:
      - octopus-repo:/repository
      - octopus-artifacts:/artifacts
      - octopus-taskLogs:/taskLogs
      - octopus-cache:/cache

networks:
  dba-lab_dba-lab:
    external: true

volumes:
  octopus-db-data:
  octopus-repo:
  octopus-artifacts:
  octopus-taskLogs:
  octopus-cache:
