name: Database CI/CD

# PR            -> build + tests
# push to dev   -> build + tests -> deploy dev
# push to qa    -> build + tests -> deploy qa
# push to main  -> build + tests -> deploy prod (GitHub Environment approval)

on:
  pull_request:
    branches: [dev, qa, main]
    paths:
      - "database/**"
      - "database.tests/**"
      - ".github/workflows/db-*.yml"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [dev, qa, main]
    paths:
      - "database/**"
      - "database.tests/**"
      - ".github/workflows/db-*.yml"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/database-tests.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Build dacpac
        run: dotnet build database/database.sqlproj -c Release --nologo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-dacpac
          path: database/bin/Release/database.dacpac
          if-no-files-found: error

  # One deploy job; the GitHub Environment (and therefore its secrets and approval rules) is chosen
  # from the ref. It is a plain job, not a reusable-workflow call, so Environment secrets resolve normally.
  deploy:
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/dev","refs/heads/qa","refs/heads/main"]'), github.ref)
    needs: [tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for azure/login
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    # One deploy per environment at a time; never cancel one that is mid-publish.
    concurrency:
      group: db-deploy-${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
      # dev may drop data freely; qa and prod fail the publish if the change could lose data.
      BLOCK_DATA_LOSS: ${{ github.ref == 'refs/heads/dev' && 'false' || 'true' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: database-dacpac
          path: dacpac

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Serverless databases auto-pause; the first connection fails while the database resumes
      # ("Database ... is not currently available"). Poke it, wait if that failed, then publish.
      - name: Prepare wake-up query
        run: echo "SELECT 1;" > wake.sql

      - name: Wake database
        id: wake
        continue-on-error: true
        uses: azure/sql-action@dae62750f3e645283b7755717b44a2029c0735fb # v2.3
        with:
          connection-string: Server=${{ secrets.SQL_SERVER }};Initial Catalog=${{ secrets.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True
          path: wake.sql

      - name: Wait for the database to resume
        if: steps.wake.outcome == 'failure'
        run: sleep 90

      # azure/sql-action shells out to `sqlpackage`, which the ubuntu runner image no longer ships.
      - name: Install SqlPackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish dacpac to ${{ env.TARGET_ENV }}
        uses: azure/sql-action@dae62750f3e645283b7755717b44a2029c0735fb # v2.3
        with:
          connection-string: Server=${{ secrets.SQL_SERVER }};Initial Catalog=${{ secrets.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True
          path: dacpac/database.dacpac
          action: publish
          arguments: /p:BlockOnPossibleDataLoss=${{ env.BLOCK_DATA_LOSS }} /p:DropObjectsNotInSource=false
