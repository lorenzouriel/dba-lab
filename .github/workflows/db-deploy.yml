name: Deploy database (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment to deploy to (dev, qa, prod)
        required: true
        type: string
      block-data-loss:
        description: Fail the publish if the schema change could lose data
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # One deploy per environment at a time; never cancel one that is mid-publish.
    concurrency:
      group: db-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: database-dacpac
          path: dacpac

      # The repo is public, so Actions logs are too. These identifiers are stored as Environment
      # secrets so GitHub masks them in logs (variables are printed in clear in step headers).
      - name: Check required Environment secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID SQL_SERVER SQL_DATABASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty or missing. Add it as an Environment secret (not a variable) on the '${{ inputs.environment }}' Environment."
              missing=1
            fi
          done
          exit $missing

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish dacpac to ${{ inputs.environment }}
        uses: azure/sql-action@v2.3
        with:
          connection-string: Server=${{ secrets.SQL_SERVER }};Initial Catalog=${{ secrets.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True
          path: dacpac/database.dacpac
          action: publish
          arguments: /p:BlockOnPossibleDataLoss=${{ inputs.block-data-loss }} /p:DropObjectsNotInSource=false
