name: Deploy DP-800 quiz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dp800/quiz/**"
      - ".github/workflows/deploy-quiz.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload quiz app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dp800/quiz

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
